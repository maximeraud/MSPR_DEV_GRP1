# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install project
      run: pip install -e .


    - name: Install dependencies
      run: |
        sudo apt-get update 
        sudo apt-get install -y libmariadb-dev libmariadb-dev-compat mariadb-server
        python -m pip install --upgrade pip
        pip install flake8 pytest python-dotenv paramiko typer rich mariadb
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install MariaDB server
      run: |
        sudo service mysql start
        sudo mysql -u root -e "CREATE DATABASE IF NOT EXISTS testdb;"
        sudo mysql -u root -e "CREATE USER IF NOT EXISTS 'admin'@'localhost' IDENTIFIED BY 'admin';"
        sudo mysql -u root -e "GRANT ALL PRIVILEGES ON testdb.* TO 'admin'@'localhost';"
        sudo mysql -u root -e "FLUSH PRIVILEGES;"
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Indication du PYTHONPATH et test avec pytest  
      env:
        PYTHONPATH: src
      run: |
        pytest -v src/tests
